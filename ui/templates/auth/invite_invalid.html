<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Invalid invite</title>
  <style>
    body { font-family: -apple-system, sans-serif; display: flex; align-items: center;
           justify-content: center; min-height: 100vh; background: #f5f5f3; }
    .card { background: #fff; border-radius: 12px; border: 1px solid #e5e5e3;
            padding: 2.5rem 2rem; max-width: 400px; text-align: center; }
    h2 { font-size: 18px; color: #1a1a2e; margin-bottom: 0.5rem; }
    p { font-size: 14px; color: #888; }
    a { color: #1a1a2e; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Invite link invalid</h2>
    <p>
      {% if reason == 'expired' %}
        This invite link has expired. Ask your admin to send a new one.
      {% else %}
        This invite link has already been used or is invalid.
      {% endif %}
    </p>
    <p style="margin-top:1rem"><a href="/auth/login">Back to sign in</a></p>
  </div>
</body>
</html>
