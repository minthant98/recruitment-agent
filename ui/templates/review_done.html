<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decision submitted — Recruitment</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', -apple-system, sans-serif; background: #f5f5f3;
       min-height: 100vh; display: flex; align-items: center;
       justify-content: center; padding: 1rem; }
.card { background: #fff; border-radius: 12px; border: 1px solid #e5e5e3;
        padding: 3rem 2rem; max-width: 440px; width: 100%; text-align: center; }
.icon { font-size: 52px; margin-bottom: 1.25rem; }
h1 { font-size: 20px; font-weight: 500; color: #1a1a1a; margin-bottom: 0.5rem; }
p { font-size: 14px; color: #888; line-height: 1.6; margin-bottom: 2rem; }
.actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn-primary { background: #1a1a2e; color: #fff; border: none; padding: 10px 20px;
               border-radius: 8px; font-size: 14px; font-weight: 500;
               cursor: pointer; text-decoration: none; display: inline-block; }
.btn-primary:hover { opacity: 0.88; }
.btn-secondary { background: #fff; color: #444; border: 1px solid #ddd;
                 padding: 10px 20px; border-radius: 8px; font-size: 14px;
                 text-decoration: none; display: inline-block; }
.btn-secondary:hover { border-color: #1a1a2e; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Decision submitted</h1>
    <p>Your review for <strong>{{ name }}</strong> has been recorded.
       The pipeline will continue automatically.</p>
    <div class="actions">
      <a href="/dashboard" class="btn-primary">← Back to dashboard</a>
      <a href="/history" class="btn-secondary">View all candidates</a>
    </div>
  </div>
</body>
</html>
