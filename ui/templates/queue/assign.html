<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assign job — Recruitment</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', -apple-system, sans-serif; background: #f5f5f3;
           color: #1a1a1a; min-height: 100vh; }
    nav { background: #1a1a2e; padding: 0 2rem; height: 56px;
          display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { color: #fff; font-weight: 500; font-size: 15px; text-decoration: none; }
    .nav-user { color: #888; font-size: 13px; }

    .page { max-width: 560px; margin: 0 auto; padding: 2rem 1.5rem; }
    .back { font-size: 13px; color: #888; text-decoration: none; margin-bottom: 1.5rem; display: inline-block; }
    .back:hover { color: #1a1a2e; }

    .card { background: #fff; border-radius: 12px; border: 1px solid #e5e5e3; padding: 2rem; }
    .card-title { font-size: 18px; font-weight: 500; margin-bottom: 0.4rem; }
    .card-sub { font-size: 14px; color: #888; margin-bottom: 1.5rem; }

    .info-row { display: flex; gap: 8px; align-items: center;
                padding: 10px 0; border-bottom: 1px solid #f5f5f3; font-size: 14px; }
    .info-label { color: #888; width: 100px; flex-shrink: 0; }

    .notice { background: #fce4ec; border: 1px solid #f48fb1; border-radius: 8px;
              padding: 12px 16px; font-size: 13px; color: #c62828; margin: 1.5rem 0; }

    .field { margin-top: 1.5rem; }
    label { display: block; font-size: 13px; font-weight: 500; color: #444; margin-bottom: 6px; }
    select { width: 100%; padding: 10px 12px; border: 1px solid #ddd;
             border-radius: 8px; font-size: 14px; background: #fafafa;
             outline: none; font-family: inherit; }
    select:focus { border-color: #1a1a2e; }

    .actions { display: flex; gap: 10px; margin-top: 1.5rem; }
    .btn-primary { background: #1a1a2e; color: #fff; border: none; padding: 11px 24px;
                   border-radius: 8px; font-size: 14px; font-weight: 500;
                   cursor: pointer; font-family: inherit; flex: 1; }
    .btn-primary:hover { opacity: 0.88; }
    .btn-secondary { background: #fff; color: #444; border: 1px solid #ddd;
                     padding: 11px 24px; border-radius: 8px; font-size: 14px;
                     cursor: pointer; font-family: inherit; text-decoration: none;
                     display: inline-flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
<nav>
  <a href="/dashboard" class="nav-logo">Recruitment</a>
  <span class="nav-user">{{ user.email }}</span>
</nav>

<div class="page">
  <a href="/dashboard" class="back">← Dashboard</a>

  <div class="card">
    <div class="card-title">Assign job manually</div>
    <div class="card-sub">The system couldn't match this CV to any open role. Please assign it manually.</div>

    <div class="info-row">
      <span class="info-label">Candidate</span>
      <span>{{ candidate.get('name', 'Unknown') }}</span>
    </div>
    <div class="info-row" style="border:none">
      <span class="info-label">Email</span>
      <span>{{ candidate.get('email', '—') }}</span>
    </div>

    <div class="notice">
      The AI could not confidently match this CV to any open role.
    </div>

    <form method="POST" action="/assign/{{ run.id }}">
      <div class="field">
        <label for="job_id">Assign to role</label>
        <select name="job_id" id="job_id" required>
          <option value="">Choose a role...</option>
          {% for job in jobs %}
          <option value="{{ job.id }}">{{ job.role_title }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="actions">
        <a href="/dashboard" class="btn-secondary">Cancel</a>
        <button type="submit" class="btn-primary">Assign & start screening</button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
